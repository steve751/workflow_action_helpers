[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steves-workflow-helpers"
version = "0.3.2"
description = "Helpers, custom step types and datahub-actions plugins for DataHub workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # The schema-membership-sync ingestion source imports datahub_actions when it loads, so the
    # executor venv must have it. Without it DataHub reports the source as disabled.
    "acryl-datahub-actions>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "acryl-datahub-actions"]

# Lets a recipe say `type: schema_membership_sync`. The module is only imported when the action
# is used, so the engine steps do not need acryl-datahub-actions.
[project.entry-points."datahub_actions.action.plugins"]
schema_membership_sync = "steves_workflow_helpers.plugins.schema_membership_sync:SchemaMembershipSyncAction"

# Lets an ingestion source say `type: schema-membership-sync`, which runs the action above as a
# long-lived pipeline on the executor (the same way the workflow engine runs).
[project.entry-points."datahub.ingestion.source.plugins"]
schema-membership-sync = "steves_workflow_helpers.plugins.schema_membership_sync_source:SchemaMembershipSyncSource"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
